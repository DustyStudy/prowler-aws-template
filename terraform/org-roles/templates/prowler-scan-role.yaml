AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Read-only role that Prowler (running in GitHub Actions via the scanner account)
  assumes to scan this account. Deployed to every account by the prowler-scan-role StackSet.

Parameters:
  ScannerAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: Account that hosts the prowler-gha-runner role.
  RunnerRoleName:
    Type: String
    Default: prowler-gha-runner
  RoleName:
    Type: String
    Default: ProwlerScan

Resources:
  ProwlerScanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Read-only role assumed by Prowler for security scanning
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Trust the account root + pin to the runner role ARN, so the trust policy
          # stays valid even if the runner role is deleted and recreated.
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${ScannerAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn: !Sub "arn:${AWS::Partition}:iam::${ScannerAccountId}:role/${RunnerRoleName}"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/SecurityAudit"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/job-function/ViewOnlyAccess"
      Policies:
        # Upstream: prowler-cloud/prowler permissions/prowler-additions-policy.json (v5.43.0),
        # minus securityhub:BatchImportFindings (write; Security Hub integration is not used).
        - PolicyName: ProwlerAdditions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowMoreReadOnly
                Effect: Allow
                Resource: "*"
                Action:
                  - account:Get*
                  - amplify:ListApps
                  - amplify:ListBranches
                  - appstream:Describe*
                  - appstream:List*
                  - backup:List*
                  - backup:Get*
                  - bedrock:List*
                  - bedrock:Get*
                  - cloudtrail:GetInsightSelectors
                  - codeartifact:List*
                  - codebuild:BatchGet*
                  - codebuild:ListReportGroups
                  - cognito-idp:GetUserPoolMfaConfig
                  - datapipeline:DescribePipelines
                  - datapipeline:GetPipelineDefinition
                  - datapipeline:ListPipelines
                  - dlm:Get*
                  - drs:Describe*
                  - ds:Get*
                  - ds:Describe*
                  - ds:List*
                  - dynamodb:GetResourcePolicy
                  - ec2:GetEbsEncryptionByDefault
                  - ec2:GetSnapshotBlockPublicAccessState
                  - ec2:GetInstanceMetadataDefaults
                  - ecr:Describe*
                  - ecr:GetRegistryScanningConfiguration
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - elasticfilesystem:DescribeBackupPolicy
                  - glue:GetConnections
                  - glue:GetSecurityConfiguration*
                  - glue:SearchTables
                  - glue:GetMLTransforms
                  - inspector2:BatchGetFindingDetails
                  - lambda:GetFunction*
                  - lambda:GetLayerVersion
                  - logs:FilterLogEvents
                  - lightsail:GetRelationalDatabases
                  - macie2:GetMacieSession
                  - macie2:GetAutomatedDiscoveryConfiguration
                  - rolesanywhere:ListProfiles
                  - rolesanywhere:ListTagsForResource
                  - rolesanywhere:ListTrustAnchors
                  - s3:GetAccountPublicAccessBlock
                  - s3:GetObjectAcl
                  - s3:ListBucket
                  - shield:DescribeProtection
                  - shield:GetSubscriptionState
                  - securityhub:GetFindings
                  - servicecatalog:Describe*
                  - servicecatalog:List*
                  - ssm:GetDocument
                  - ssm-incidents:List*
                  - states:ListTagsForResource
                  - support:Describe*
                  - tag:GetTagKeys
                  - wellarchitected:List*
              - Sid: AllowAPIGatewayReadOnly
                Effect: Allow
                Action:
                  - apigateway:GET
                Resource:
                  - arn:*:apigateway:*::/restapis/*
                  - arn:*:apigateway:*::/apis/*
                  - arn:*:apigateway:*::/domainnames
                  - arn:*:apigateway:*::/domainnames/*

Outputs:
  RoleArn:
    Value: !GetAtt ProwlerScanRole.Arn
