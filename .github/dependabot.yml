version: 2
updates:
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    cooldown:
      default-days: 7
    directories:
      - /terraform/bootstrap
      - /terraform/scanner
      - /terraform/org-roles
    schedule:
      interval: monthly
    groups:
      terraform:
        patterns: ["*"]
