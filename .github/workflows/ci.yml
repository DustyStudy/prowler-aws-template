name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap, scanner, org-roles]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.15"

      - name: fmt
        run: terraform fmt -check -recursive
        working-directory: terraform/${{ matrix.stack }}

      - name: validate
        working-directory: terraform/${{ matrix.stack }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # Plan-only; the test file uses dummy credentials, so no AWS access.
      - name: test
        if: hashFiles(format('terraform/{0}/tests/*.tftest.hcl', matrix.stack)) != ''
        working-directory: terraform/${{ matrix.stack }}
        run: terraform test

  python:
    name: Python (report email)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: pytest
        run: |
          pip install --quiet "pytest==9.1.1"
          python -m pytest tests -q
