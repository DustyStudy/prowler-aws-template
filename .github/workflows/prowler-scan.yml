name: Prowler scan

on:
  schedule:
    - cron: "0 6 * * 0" # Sundays 06:00 UTC
  # checkov:skip=CKV_GHA_7:The accounts input is passed via env and must match ^[0-9]{12}(,[0-9]{12})*$ before use
  workflow_dispatch:
    inputs:
      accounts:
        description: "Comma-separated account IDs to scan (blank = every active account in the org)"
        required: false
        default: ""

# Each job that assumes an AWS role grants id-token itself.
permissions:
  contents: read

concurrency:
  group: prowler-scan
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  SCAN_REGIONS: us-east-1 # space-separated list passed to prowler -f
  PROWLER_VERSION: "5.43.0"
  SCAN_ROLE_NAME: ProwlerScan
  RUNNER_ROLE_ARN: arn:aws:iam::${{ vars.SCANNER_ACCOUNT_ID }}:role/prowler-gha-runner

jobs:
  discover:
    name: Discover accounts
    # Skip cleanly in the template repo and in new copies that aren't configured yet.
    if: vars.SCANNER_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC to AWS
      contents: read
    outputs:
      accounts: ${{ steps.list.outputs.accounts }}
      account_names: ${{ steps.list.outputs.account_names }}
      run_date: ${{ steps.list.outputs.run_date }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Assume runner role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume management ProwlerScan role (can list org accounts)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT_ID }}:role/${{ env.SCAN_ROLE_NAME }}
          role-chaining: true
          role-skip-session-tagging: true # ProwlerScan's trust policy doesn't allow sts:TagSession
          role-session-name: prowler-discover
          aws-region: ${{ env.AWS_REGION }}

      - name: List accounts
        id: list
        env:
          INPUT_ACCOUNTS: ${{ inputs.accounts }}
        run: |
          set -euo pipefail
          org=$(aws organizations list-accounts --output json)
          if [[ -n "${INPUT_ACCOUNTS// /}" ]]; then
            cleaned="${INPUT_ACCOUNTS// /}"
            if [[ ! "$cleaned" =~ ^[0-9]{12}(,[0-9]{12})*$ ]]; then
              echo "::error::accounts must be comma-separated 12-digit IDs"; exit 1
            fi
            accounts=$(jq -cn --arg a "$cleaned" '$a | split(",")')
          else
            accounts=$(jq -c '[.Accounts[] | select((.State // .Status) == "ACTIVE") | .Id] | sort' <<< "$org")
          fi
          echo "Accounts: $accounts"
          echo "accounts=$accounts" >> "$GITHUB_OUTPUT"
          echo "account_names=$(jq -c '[.Accounts[] | {key: .Id, value: .Name}] | from_entries' <<< "$org")" >> "$GITHUB_OUTPUT"
          echo "run_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.account }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      id-token: write # OIDC to AWS
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        account: ${{ fromJson(needs.discover.outputs.accounts) }}
    env:
      ACCOUNT_ID: ${{ matrix.account }}
      RUN_DATE: ${{ needs.discover.outputs.run_date }}
      REPORTS_BUCKET: ${{ vars.REPORTS_BUCKET }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Prowler
        run: pip install --quiet "prowler==${PROWLER_VERSION}"

      # Prowler assumes ProwlerScan in the target account itself and refreshes
      # those chained credentials, so the runner session must outlive the scan.
      - name: Assume runner role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          role-duration-seconds: 14400
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Prowler
        run: |
          set -euo pipefail
          extra=()
          if [[ -f config/mutelist.yaml ]]; then
            extra+=(--mutelist-file config/mutelist.yaml)
          fi
          # shellcheck disable=SC2086
          prowler aws \
            --role "arn:aws:iam::${ACCOUNT_ID}:role/${SCAN_ROLE_NAME}" \
            --role-session-name prowler-scan \
            -f $SCAN_REGIONS \
            -M csv html json-ocsf \
            -o output \
            -F "prowler-${ACCOUNT_ID}" \
            --no-banner \
            --ignore-exit-code-3 \
            "${extra[@]}"

      - name: Upload reports to S3
        if: always()
        run: |
          if [[ -d output ]]; then
            aws s3 cp output "s3://${REPORTS_BUCKET}/reports/${RUN_DATE}/${ACCOUNT_ID}/" --recursive --only-show-errors
          fi

      # Hand the HTML + OCSF files to the email job. One-day retention keeps artifact storage near zero.
      - name: Keep reports for the email job
        if: always() && vars.REPORT_EMAIL != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prowler-${{ matrix.account }}
          path: |
            output/prowler-${{ matrix.account }}.html
            output/prowler-${{ matrix.account }}.ocsf.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          ocsf="output/prowler-${ACCOUNT_ID}.ocsf.json"
          {
            echo "### Prowler: ${ACCOUNT_ID}"
            if [[ -f "$ocsf" ]]; then
              echo ""
              echo "| Severity | Failed (not muted) |"
              echo "|---|---|"
              jq -r '
                [.[] | select(.status_code == "FAIL" and .status != "Suppressed") | .severity]
                | group_by(.) | map({s: .[0], n: length})
                | sort_by({"Critical":0,"High":1,"Medium":2,"Low":3,"Informational":4}[.s] // 9)
                | .[] | "| \(.s) | \(.n) |"' "$ocsf"
              echo ""
              echo "Total checks evaluated: $(jq length "$ocsf")"
            else
              echo "No OCSF output produced; see the Run Prowler step log."
            fi
            echo ""
            echo "Reports: \`s3://${REPORTS_BUCKET}/reports/${RUN_DATE}/${ACCOUNT_ID}/\`"
          } >> "$GITHUB_STEP_SUMMARY"

  email:
    name: Email reports
    needs: [discover, scan]
    # Runs even if some account scans failed, so the email reports them.
    if: always() && needs.discover.result == 'success' && vars.REPORT_EMAIL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC to AWS
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prowler-*
          path: reports

      - name: Assume runner role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send email
        env:
          REPORT_EMAIL: ${{ vars.REPORT_EMAIL }}
          REPORT_FROM_EMAIL: ${{ vars.REPORT_FROM_EMAIL }}
          REPORTS_BUCKET: ${{ vars.REPORTS_BUCKET }}
          ACCOUNTS: ${{ needs.discover.outputs.accounts }}
          ACCOUNT_NAMES: ${{ needs.discover.outputs.account_names }}
          RUN_DATE: ${{ needs.discover.outputs.run_date }}
          SCAN_RESULT: ${{ needs.scan.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/send_report_email.py reports
