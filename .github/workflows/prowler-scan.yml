name: Prowler scan

on:
  schedule:
    - cron: "0 6 * * 0" # Sundays 06:00 UTC
  workflow_dispatch:
    inputs:
      accounts:
        description: "Comma-separated account IDs to scan (blank = every active account in the org)"
        required: false
        default: ""

permissions:
  id-token: write # OIDC to AWS
  contents: read

concurrency:
  group: prowler-scan
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  SCAN_REGIONS: us-east-1 # space-separated list passed to prowler -f
  PROWLER_VERSION: "5.43.0"
  SCAN_ROLE_NAME: ProwlerScan
  RUNNER_ROLE_ARN: arn:aws:iam::${{ vars.SCANNER_ACCOUNT_ID }}:role/prowler-gha-runner

jobs:
  discover:
    name: Discover accounts
    # Skip cleanly in the template repo and in new copies that aren't configured yet.
    if: vars.SCANNER_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      accounts: ${{ steps.list.outputs.accounts }}
      run_date: ${{ steps.list.outputs.run_date }}
    steps:
      - name: Assume runner role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume management ProwlerScan role (can list org accounts)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT_ID }}:role/${{ env.SCAN_ROLE_NAME }}
          role-chaining: true
          role-skip-session-tagging: true # ProwlerScan's trust policy doesn't allow sts:TagSession
          role-session-name: prowler-discover
          aws-region: ${{ env.AWS_REGION }}

      - name: List accounts
        id: list
        env:
          INPUT_ACCOUNTS: ${{ inputs.accounts }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_ACCOUNTS// /}" ]]; then
            cleaned="${INPUT_ACCOUNTS// /}"
            if [[ ! "$cleaned" =~ ^[0-9]{12}(,[0-9]{12})*$ ]]; then
              echo "::error::accounts must be comma-separated 12-digit IDs"; exit 1
            fi
            accounts=$(jq -cn --arg a "$cleaned" '$a | split(",")')
          else
            accounts=$(aws organizations list-accounts --output json \
              | jq -c '[.Accounts[] | select((.State // .Status) == "ACTIVE") | .Id] | sort')
          fi
          echo "Accounts: $accounts"
          echo "accounts=$accounts" >> "$GITHUB_OUTPUT"
          echo "run_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.account }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        account: ${{ fromJson(needs.discover.outputs.accounts) }}
    env:
      ACCOUNT_ID: ${{ matrix.account }}
      RUN_DATE: ${{ needs.discover.outputs.run_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Prowler
        run: pip install --quiet "prowler==${PROWLER_VERSION}"

      # Prowler assumes ProwlerScan in the target account itself and refreshes
      # those chained credentials, so the runner session must outlive the scan.
      - name: Assume runner role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          role-duration-seconds: 14400
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Prowler
        run: |
          set -euo pipefail
          extra=()
          if [[ -f config/mutelist.yaml ]]; then
            extra+=(--mutelist-file config/mutelist.yaml)
          fi
          # shellcheck disable=SC2086
          prowler aws \
            --role "arn:aws:iam::${ACCOUNT_ID}:role/${SCAN_ROLE_NAME}" \
            --role-session-name prowler-scan \
            -f $SCAN_REGIONS \
            -M csv html json-ocsf \
            -o output \
            -F "prowler-${ACCOUNT_ID}" \
            --no-banner \
            --ignore-exit-code-3 \
            "${extra[@]}"

      - name: Upload reports to S3
        if: always()
        run: |
          if [[ -d output ]]; then
            aws s3 cp output "s3://${{ vars.REPORTS_BUCKET }}/reports/${RUN_DATE}/${ACCOUNT_ID}/" --recursive --only-show-errors
          fi

      - name: Summary
        if: always()
        run: |
          ocsf="output/prowler-${ACCOUNT_ID}.ocsf.json"
          {
            echo "### Prowler: ${ACCOUNT_ID}"
            if [[ -f "$ocsf" ]]; then
              echo ""
              echo "| Severity | Failed (not muted) |"
              echo "|---|---|"
              jq -r '
                [.[] | select(.status_code == "FAIL" and .status != "Suppressed") | .severity]
                | group_by(.) | map({s: .[0], n: length})
                | sort_by({"Critical":0,"High":1,"Medium":2,"Low":3,"Informational":4}[.s] // 9)
                | .[] | "| \(.s) | \(.n) |"' "$ocsf"
              echo ""
              echo "Total checks evaluated: $(jq length "$ocsf")"
            else
              echo "No OCSF output produced; see the Run Prowler step log."
            fi
            echo ""
            echo "Reports: \`s3://${{ vars.REPORTS_BUCKET }}/reports/${RUN_DATE}/${ACCOUNT_ID}/\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save counts for email
        if: always() && vars.NOTIFY_TOPIC_ARN != ''
        run: |
          ocsf="output/prowler-${ACCOUNT_ID}.ocsf.json"
          mkdir -p counts
          if [[ -f "$ocsf" ]]; then
            jq -c --arg a "$ACCOUNT_ID" '{
              account: $a,
              total: length,
              failed: ([.[] | select(.status_code == "FAIL" and .status != "Suppressed") | .severity]
                       | group_by(.) | map({key: .[0], value: length}) | from_entries)
            }' "$ocsf" > "counts/${ACCOUNT_ID}.json"
          else
            jq -cn --arg a "$ACCOUNT_ID" '{account: $a, error: true}' > "counts/${ACCOUNT_ID}.json"
          fi

      - name: Upload counts
        if: always() && vars.NOTIFY_TOPIC_ARN != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: counts-${{ matrix.account }}
          path: counts/
          retention-days: 1

  notify:
    name: Email summary
    needs: [discover, scan]
    if: always() && needs.discover.result == 'success' && vars.NOTIFY_TOPIC_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_DATE: ${{ needs.discover.outputs.run_date }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TOPIC_ARN: ${{ vars.NOTIFY_TOPIC_ARN }}
      REPORTS_BUCKET: ${{ vars.REPORTS_BUCKET }}
    steps:
      - name: Download counts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: counts-*
          path: counts
          merge-multiple: true

      - name: Assume runner role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.RUNNER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish to SNS
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(counts/*.json)
          all='[]'
          if (( ${#files[@]} )); then all=$(jq -s 'sort_by(.account)' "${files[@]}"); fi

          body=$(jq -r --arg url "$RUN_URL" --arg date "$RUN_DATE" --arg bucket "$REPORTS_BUCKET" '
            def n($s): (.failed[$s] // 0) | tostring;
            def pad($w): tostring | . + (" " * ([$w - length, 0] | max));
            "Prowler scan \($date)\n",
            "Failed findings (not muted) by account:\n",
            "\("Account" | pad(14))\("Crit" | pad(6))\("High" | pad(6))\("Med" | pad(6))\("Low" | pad(6))Info",
            (.[] | if .error then "\(.account | pad(14))scan failed, see the run log"
                   else "\(.account | pad(14))\(n("Critical") | pad(6))\(n("High") | pad(6))\(n("Medium") | pad(6))\(n("Low") | pad(6))\(n("Informational"))" end),
            (if length == 0 then "(no scan results)" else empty end),
            "\nTotals: \([.[].failed // {} | to_entries[] | select(.key == "Critical" or .key == "High") | .value] | add // 0) critical/high findings across \(length) account(s).",
            "\nRun: \($url)",
            "Reports: s3://\($bucket)/reports/\($date)/"
          ' <<<"$all")

          crit=$(jq '[.[].failed.Critical // 0] | add // 0' <<<"$all")
          failed=$(jq '[.[] | select(.error)] | length' <<<"$all")
          subject="Prowler ${RUN_DATE}: ${crit} critical finding(s)"
          if (( failed > 0 )); then subject+=", ${failed} scan(s) failed"; fi
          echo "$body"
          aws sns publish --topic-arn "$TOPIC_ARN" --subject "$subject" --message "$body" >/dev/null
